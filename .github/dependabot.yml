version: 2

# 依赖更新：按月、分组，尽量少打扰。
# 本项目的依赖面较窄（Tauri 2 + Rust 生态），重点是让安全补丁能自动浮出来。
updates:
  # 前端依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    labels: ["dependencies"]
    ignore:
      # TypeScript 7 是 Go 重写版，npm 包不再导出编译器 API
      # （`ts.createSourceFile` / `SyntaxKind` / `forEachChild` 全没了），
      # 只剩一个明确标着 unstable 的 `typescript/unstable/ast`。
      # 本仓库的 scripts/i18n_check.mjs 与 scripts/i18n_extract.mjs 正是建在旧 API 上，
      # 直接升 7 会让 `npm run i18n:check` 当场崩掉（实测：ts.ScriptTarget undefined）。
      # 迁移到 unstable API 属独立专项，完成前不接受自动 PR。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Rust 依赖（workspace 根，覆盖 core 与 src-tauri）
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
    labels: ["dependencies"]
    ignore:
      # 与 hudsucker 0.20 的 hyper 0.14 生态绑死，擅自升级会破坏代理引擎的类型契约。
      # 升级需要连同 hudsucker 一起换，属人工专项，不接受自动 PR。
      - dependency-name: "hyper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "hyper-rustls"
      - dependency-name: "tokio-rustls"
      # hudsucker 是上面那三项的「因」：0.21 仍在 hyper 0.14 / http 0.2 / tokio-rustls 0.24 上，
      # 0.22 起整体换到 hyper 1.x / http 1.x / tokio-rustls 0.26。
      # 也就是说 0.21 -> 0.22 不是版本号改动，是换生态，代理引擎的请求/响应类型要整体改写。
      # 所以只放行 0.21.x，0.22 以上一律不接受自动 PR。
      - dependency-name: "hudsucker"
        versions: [">= 0.22.0"]

  # Actions 本身
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
