name: CI

# 质量门：每次 push / PR 都跑前端构建、多语言自检与 Rust 全工作区测试，
# 让类型错误与测试回归无法搭着某个 tag 直接进 Release。
# 打包在 release.yml，端到端界面扫描（i18n:e2e）依赖真浏览器与 dev server，
# 属本地可选验收，不放进 CI——放进来只会带来不稳定红灯，掩盖真实回归。
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端构建与多语言自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: 类型检查 + 打包（tsc && vite build）
        run: npm run build

      - name: 词典自检（键与调用点是否对齐、有无漏译）
        run: npm run i18n:check

      - name: 窗口标题与 <html lang> 同步自检
        run: npm run i18n:locale

  rust:
    name: Rust 全工作区测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # tauri-build 在编译期校验 frontendDist（../dist）存在；
      # 空目录即可满足（tauri-codegen 只判 exists()，不要求 index.html），
      # 真实前端产物由 frontend job 与 release 流程负责。
      - name: 占位 dist（满足 tauri-build 的存在性校验）
        run: New-Item -ItemType Directory -Force -Path dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # 预热 Windows PowerShell。
      #
      # 背景：commands::ca_trust_tests::test_query_trust_counters_channel 会真起一次
      # powershell.exe 去枚举注册表，而 query_trust_counters 内部有 **20s 超时**
      # （那是生产侧的 UX 边界：绝不让一个卡死的 PowerShell 把界面拖住）。
      # 在冷启动的 windows-latest 上，第一次拉起 powershell.exe 偶尔会超过 20s，
      # 于是这条用例随机变红，看起来像「检测通道坏了」，其实只是环境冷。
      #
      # 判据（不是猜的）：48cc835 那次 CI 红、紧接着的 0c74768 绿，
      # 而这两次的 Rust 源码与 Cargo.lock **完全一致**（`git diff` 只差本文件），
      # 本机连跑稳定通过 —— 同一份二进制两种结果，说明是用例随环境抖动。
      #
      # 做法：先单独把 powershell.exe 拉起来一次，把冷启动成本从被测路径里挪走。
      # 注意必须用 powershell.exe（Windows PowerShell 5.1），不是 pwsh ——
      # 被测代码拉起的就是 5.1，预热 pwsh 不起作用。
      # 断言本身**不放宽**：通道真坏时（指纹算错 / 解码失败 / PS 报错）照样立刻失败。
      - name: 预热 Windows PowerShell（避免冷启动打爆 20s 检测超时）
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -Command "Write-Output warm"

      # 编译与运行分成两步：编译失败和测试失败在步骤名上就能区分开，
      # 不必去猜「到底是编不过还是测不过」。
      - name: 编译测试二进制
        run: cargo test --workspace --no-run

      # 失败时把「哪个用例挂了」和「为什么挂」都写成 Actions 注解。
      # 动机：Actions 日志要仓库写权限才能下载，注解任何人都能读——
      # 对没有权限的外部贡献者、以及对自动化排查都更友好。
      #
      # 2026-09-14 补记：旧版只 Select-String 'panicked at' 那一行，
      # 于是注解里只剩「在 commands.rs:1214 挂了」，**看不出为什么挂**——
      # panic 的正文（assert 文案 / Err 文案）在它的下一行。
      # 那次排查被迫去猜是超时、是 PowerShell 失败、还是指纹算错。
      # 现在把下一行一起带出来：注解必须自带结论，否则等于没有。
      # 注意 GitHub 对单个 step 的注解条数有上限，所以只挑关键行，不做整段 dump。
      - name: 运行测试
        shell: pwsh
        run: |
          $out = & cargo test --workspace --no-fail-fast 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            for ($i = 0; $i -lt $out.Count; $i++) {
              $line = "$($out[$i])".Trim()
              if ($line -match '^test .+ \.\.\. FAILED') {
                Write-Host "::error::$line"
              }
              elseif ($line -match 'panicked at') {
                Write-Host "::error::$line"
                # panic 正文在下一行，必须一并带出
                if ($i + 1 -lt $out.Count) {
                  $next = "$($out[$i + 1])".Trim()
                  if ($next) { Write-Host "::error::$next" }
                }
              }
            }
            exit $code
          }
