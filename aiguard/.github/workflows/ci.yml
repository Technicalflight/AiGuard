name: CI

# 质量门：每次 push / PR 都跑前端构建、多语言自检与 Rust 全工作区测试，
# 让类型错误与测试回归无法搭着某个 tag 直接进 Release。
# 打包在 release.yml，端到端界面扫描（i18n:e2e）依赖真浏览器与 dev server，
# 属本地可选验收，不放进 CI——放进来只会带来不稳定红灯，掩盖真实回归。
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端构建与多语言自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: 类型检查 + 打包（tsc && vite build）
        run: npm run build

      - name: 词典自检（键与调用点是否对齐、有无漏译）
        run: npm run i18n:check

      - name: 窗口标题与 <html lang> 同步自检
        run: npm run i18n:locale

  rust:
    name: Rust 全工作区测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # tauri-build 在编译期校验 frontendDist（../dist）存在；
      # 空目录即可满足（tauri-codegen 只判 exists()，不要求 index.html），
      # 真实前端产物由 frontend job 与 release 流程负责。
      - name: 占位 dist（满足 tauri-build 的存在性校验）
        run: New-Item -ItemType Directory -Force -Path dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # 编译与运行分成两步：编译失败和测试失败在步骤名上就能区分开，
      # 不必去猜「到底是编不过还是测不过」。
      - name: 编译测试二进制
        run: cargo test --workspace --no-run

      # 失败时把测试名写成 Actions 注解。
      # 动机：Actions 日志要仓库写权限才能下载，注解任何人都能读——
      # 对没有权限的外部贡献者、以及对自动化排查都更友好。
      - name: 运行测试
        shell: pwsh
        run: |
          $out = & cargo test --workspace --no-fail-fast 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out |
              Select-String -Pattern 'FAILED|panicked at|^error(\[|:)' |
              Select-Object -First 40 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit $code
          }
